name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & verify (Kernel Stages A-D)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      # Slow, TCG-only runners can raise the per-boot limit (scripts/verify.sh).
      # The default is 30s, matching the documented acceptance gate.
      # VERIFY_QEMU_TIMEOUT: 60s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm xorriso e2fsprogs qemu-system-x86 git make

      - name: Show toolchain versions
        run: |
          clang --version
          ld.lld --version
          nasm -v
          xorriso --version
          e2fsck -V
          qemu-system-x86_64 --version

      - name: Run acceptance gates
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh

      - name: Upload QEMU serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs
          path: |
            build/verify/*.log
          if-no-files-found: warn
          retention-days: 14